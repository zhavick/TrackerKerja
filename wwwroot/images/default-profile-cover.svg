<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 640" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="25%" stop-color="#1E1B4B" />
      <stop offset="55%" stop-color="#31104B" />
      <stop offset="80%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <!-- Vibrant Mesh Accents -->
    <radialGradient id="glowIndigo" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#EC4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowCyan" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowAmber" cx="90%" cy="75%" r="40%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0" />
    </radialGradient>

    <!-- Wave Gradients -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#9333EA" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Card / Badge Glass Gradients -->
    <linearGradient id="glassGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03" />
    </linearGradient>

    <linearGradient id="glassGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Filter for soft blur -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1920" height="640" fill="url(#bgGrad)" />

  <!-- Ambient Light Orbs -->
  <rect width="1920" height="640" fill="url(#glowIndigo)" />
  <rect width="1920" height="640" fill="url(#glowPurple)" />
  <rect width="1920" height="640" fill="url(#glowCyan)" />
  <rect width="1920" height="640" fill="url(#glowAmber)" />

  <!-- Perspective Cyber Grid -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="1">
    <!-- Horizontal lines -->
    <line x1="0" y1="120" x2="1920" y2="120" />
    <line x1="0" y1="220" x2="1920" y2="220" />
    <line x1="0" y1="320" x2="1920" y2="320" />
    <line x1="0" y1="420" x2="1920" y2="420" />
    <line x1="0" y1="520" x2="1920" y2="520" />
    <!-- Vertical lines -->
    <line x1="160" y1="0" x2="160" y2="640" />
    <line x1="320" y1="0" x2="320" y2="640" />
    <line x1="480" y1="0" x2="480" y2="640" />
    <line x1="640" y1="0" x2="640" y2="640" />
    <line x1="800" y1="0" x2="800" y2="640" />
    <line x1="960" y1="0" x2="960" y2="640" />
    <line x1="1120" y1="0" x2="1120" y2="640" />
    <line x1="1280" y1="0" x2="1280" y2="640" />
    <line x1="1440" y1="0" x2="1440" y2="640" />
    <line x1="1600" y1="0" x2="1600" y2="640" />
    <line x1="1760" y1="0" x2="1760" y2="640" />
  </g>

  <!-- Flowing Dynamic Waves -->
  <path d="M-100,380 C320,240 600,490 1020,340 C1440,190 1700,410 2020,290 L2020,640 L-100,640 Z"
        fill="url(#waveGrad1)" />
  <path d="M-100,470 C400,360 780,560 1200,410 C1620,260 1820,490 2050,440 L2050,640 L-100,640 Z"
        fill="url(#waveGrad2)" />

  <!-- Constellation Network / Tech Nodes -->
  <g opacity="0.35">
    <line x1="280" y1="180" x2="420" y2="120" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="4,4" />
    <line x1="420" y1="120" x2="580" y2="210" stroke="#818CF8" stroke-width="1.5" />
    <line x1="580" y1="210" x2="720" y2="150" stroke="#C084FC" stroke-width="1.5" stroke-dasharray="6,4" />
    <line x1="1300" y1="140" x2="1480" y2="220" stroke="#38BDF8" stroke-width="1.5" />
    <line x1="1480" y1="220" x2="1640" y2="110" stroke="#F472B6" stroke-width="1.5" stroke-dasharray="4,4" />
    <line x1="1640" y1="110" x2="1780" y2="180" stroke="#FBBF24" stroke-width="1.5" />

    <!-- Node circles -->
    <circle cx="280" cy="180" r="5" fill="#818CF8" />
    <circle cx="420" cy="120" r="7" fill="#6366F1" />
    <circle cx="420" cy="120" r="14" fill="none" stroke="#6366F1" stroke-width="1" opacity="0.6" />
    <circle cx="580" cy="210" r="6" fill="#A855F7" />
    <circle cx="720" cy="150" r="5" fill="#EC4899" />
    <circle cx="1300" cy="140" r="6" fill="#06B6D4" />
    <circle cx="1480" cy="220" r="8" fill="#38BDF8" />
    <circle cx="1480" cy="220" r="16" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.6" />
    <circle cx="1640" cy="110" r="7" fill="#F472B6" />
    <circle cx="1780" cy="180" r="5" fill="#F59E0B" />
  </g>

  <!-- Floating Glassmorphic Workspace Cards (Isometric/Modern) -->
  <!-- Floating Card 1: Right Upper -->
  <g transform="translate(1380, 70) rotate(-6)" filter="url(#cardShadow)">
    <rect width="260" height="150" rx="20" fill="url(#glassGrad1)" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5" />
    <circle cx="36" cy="36" r="14" fill="#6366F1" fill-opacity="0.7" />
    <rect x="62" y="26" width="100" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.85" />
    <rect x="62" y="44" width="60" height="7" rx="3.5" fill="#94A3B8" fill-opacity="0.7" />
    <!-- Progress bar in card -->
    <rect x="24" y="80" width="212" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.1" />
    <rect x="24" y="80" width="168" height="8" rx="4" fill="#38BDF8" fill-opacity="0.9" />
    <rect x="24" y="106" width="70" height="18" rx="9" fill="#10B981" fill-opacity="0.25" stroke="#10B981" stroke-width="1" />
    <text x="59" y="119" font-family="sans-serif" font-size="10" font-weight="bold" fill="#6EE7B7" text-anchor="middle">DONE 100%</text>
  </g>

  <!-- Floating Card 2: Right Lower -->
  <g transform="translate(1560, 240) rotate(8)" filter="url(#cardShadow)">
    <rect width="240" height="135" rx="20" fill="url(#glassGrad2)" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="36" cy="34" r="14" fill="#F59E0B" fill-opacity="0.7" />
    <rect x="62" y="26" width="120" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.85" />
    <rect x="24" y="68" width="192" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.1" />
    <rect x="24" y="68" width="115" height="7" rx="3.5" fill="#F59E0B" fill-opacity="0.9" />
    <!-- Priority badge -->
    <rect x="24" y="92" width="80" height="18" rx="9" fill="#EC4899" fill-opacity="0.25" stroke="#EC4899" stroke-width="1" />
    <text x="64" y="105" font-family="sans-serif" font-size="10" font-weight="bold" fill="#F472B6" text-anchor="middle">PRIORITY HIGH</text>
  </g>

  <!-- Floating Card 3: Left Center -->
  <g transform="translate(180, 90) rotate(4)" filter="url(#cardShadow)">
    <rect width="250" height="140" rx="20" fill="url(#glassGrad1)" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5" />
    <circle cx="36" cy="34" r="14" fill="#10B981" fill-opacity="0.7" />
    <rect x="62" y="26" width="110" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.85" />
    <rect x="62" y="44" width="75" height="7" rx="3.5" fill="#94A3B8" fill-opacity="0.7" />
    <rect x="24" y="76" width="202" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.1" />
    <rect x="24" y="76" width="150" height="7" rx="3.5" fill="#8B5CF6" fill-opacity="0.9" />
    <circle cx="206" cy="106" r="12" fill="#6366F1" fill-opacity="0.3" stroke="#818CF8" stroke-width="1" />
    <text x="206" y="110" font-family="sans-serif" font-size="11" font-weight="bold" fill="#C7D2FE" text-anchor="middle">★</text>
  </g>

  <!-- Floating 3D Geometric Isometric Diamonds / Cubes -->
  <g opacity="0.6">
    <!-- Cube 1 -->
    <g transform="translate(940, 100)">
      <polygon points="0,-25 25,-10 0,5 -25,-10" fill="#818CF8" fill-opacity="0.6" />
      <polygon points="0,5 25,-10 25,20 0,35" fill="#4F46E5" fill-opacity="0.8" />
      <polygon points="0,5 -25,-10 -25,20 0,35" fill="#3730A3" fill-opacity="0.9" />
    </g>
    <!-- Cube 2 -->
    <g transform="translate(1180, 160) scale(1.4)">
      <polygon points="0,-25 25,-10 0,5 -25,-10" fill="#F472B6" fill-opacity="0.6" />
      <polygon points="0,5 25,-10 25,20 0,35" fill="#DB2777" fill-opacity="0.8" />
      <polygon points="0,5 -25,-10 -25,20 0,35" fill="#9D174D" fill-opacity="0.9" />
    </g>
    <!-- Cube 3 (Small) -->
    <g transform="translate(480, 310) scale(0.8)">
      <polygon points="0,-25 25,-10 0,5 -25,-10" fill="#38BDF8" fill-opacity="0.6" />
      <polygon points="0,5 25,-10 25,20 0,35" fill="#0284C7" fill-opacity="0.8" />
      <polygon points="0,5 -25,-10 -25,20 0,35" fill="#075985" fill-opacity="0.9" />
    </g>
  </g>

  <!-- Elegant Decorative Branding Watermark in Background -->
  <g opacity="0.10" transform="translate(960, 340)">
    <text font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="64" font-weight="900" letter-spacing="12" fill="#FFFFFF" text-anchor="middle">
      WORK TRACKER PRO
    </text>
    <text y="42" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="14" font-weight="700" letter-spacing="8" fill="#38BDF8" text-anchor="middle">
      PRODUCTIVITY MATRIX • ACHIEVE MORE
    </text>
  </g>

  <!-- Sparkles / Micro Stars -->
  <g fill="#FFFFFF">
    <circle cx="340" cy="70" r="1.5" opacity="0.8" />
    <circle cx="520" cy="160" r="2" opacity="0.6" />
    <circle cx="820" cy="80" r="2.5" opacity="0.9" />
    <circle cx="1060" cy="60" r="1.5" opacity="0.7" />
    <circle cx="1240" cy="110" r="2" opacity="0.8" />
    <circle cx="1420" cy="40" r="1.5" opacity="0.5" />
    <circle cx="1720" cy="90" r="2" opacity="0.9" />
    <circle cx="1840" cy="190" r="2.5" opacity="0.7" />
    <circle cx="120" cy="280" r="1.5" opacity="0.6" />
    <circle cx="760" cy="270" r="2" opacity="0.8" />
  </g>

  <!-- Bottom Vignette / Gradient Shadow for clean integration with profile info -->
  <rect y="440" width="1920" height="200" fill="url(#bottomFade)" />
  <defs>
    <linearGradient id="bottomFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0" />
      <stop offset="50%" stop-color="#0F172A" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85" />
    </linearGradient>
  </defs>
</svg>
